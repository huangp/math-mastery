# Mac mini 自托管：docker compose up -d --build   → 经 nginx 反代为 http://math.lan（见 plugins/screentime/README.md）
services:
  math:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8142:8142"       # 只给本机 nginx 访问，局域网一律走 http://math.lan
    environment:
      PLUGINS: screentime,progress
    env_file: plugins/screentime/credit.env   # CODE_SECRET / KIDS / DAILY_CAP / TZ，不入库
    volumes:
      - math-data:/data             # /data/screentime/ledger.jsonl、/data/progress/learners.json
volumes:
  math-data:
